<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel da Barbearia Fidelis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        background: #111111;
        color: #f5f5f5;
      }

      .panel-shell {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 16px 60px;
      }

      .panel-card {
        background: #181818;
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 18px;
        padding: 22px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }

      .panel-header h1 {
        font-size: clamp(2rem, 5vw, 3rem);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px 12px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        vertical-align: middle;
      }

      th {
        color: #d4af37;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .status {
        display: inline-flex;
        padding: 0.42rem 0.72rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: capitalize;
      }

      .status.pending {
        background: rgba(212, 175, 55, 0.12);
        color: #f0d678;
      }

      .status.confirmed {
        background: rgba(43, 182, 115, 0.12);
        color: #8de0b2;
      }

      .status.canceled {
        background: rgba(240, 93, 93, 0.12);
        color: #ff9e9e;
      }

      .panel-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.6rem 0.9rem;
        border-radius: 10px;
        background: #d4af37;
        color: #111;
        font-weight: 800;
      }

      .empty-state {
        text-align: center;
        color: #b8b8b8;
      }

      @media (max-width: 760px) {
        table {
          display: block;
          overflow-x: auto;
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="panel-shell">
      <div class="panel-card">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Painel</p>
            <h1>Agendamentos</h1>
          </div>
          <a class="btn btn-primary" href="index.html">Voltar ao site</a>
        </div>

        <p id="panelStatus" class="form-status">Carregando...</p>

        <table>
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Serviço</th>
              <th>Data/Hora</th>
              <th>WhatsApp</th>
              <th>Status</th>
              <th>Valor</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="agendamentosBody"></tbody>
        </table>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
